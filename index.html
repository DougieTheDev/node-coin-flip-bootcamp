<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Flip a Coin</title>
</head>

<body>
    <h1>Flip a Coin!</h1>
    <button onclick="coinFlip()">Flip</button>
    <p id="result"></p>

    <script>
        async function coinFlip() {
            try {
                const res = await fetch('/coinFlipGameApi');
                if (!res.ok) throw new Error("Failed to fetch coin flip result.");
                const data = await res.json();
                document.getElementById('result').textContent = `Result: ${data.result}`;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('result').textContent = "Error flipping coin.";
            }
        }

    </script>



    </script>
</body>

</html>
